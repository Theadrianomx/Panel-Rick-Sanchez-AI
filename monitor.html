<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintonizando Multiverso | RICK OS</title>
    <!-- REDIRECCIÓN AUTOMÁTICA AL TÚNEL DE SERVEO EN 2 SEGUNDOS -->
    <meta http-equiv="refresh" content="2;url=https://rick-monitor-v3.serveousercontent.com/monitor" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body {
            background-color: #0b0c10;
            color: #39ff14;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: #00e5ff;
            border-bottom-color: #39ff14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); letter-spacing: 2px; }
        p { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>ESTABLECIENDO CONEXIÓN CON EL NÚCLEO...</h2>
    <p>Abriendo portal hacia la Curva Infinita Central</p>
    
    <script>
        // Respaldo de redirección
        setTimeout(() => {
            window.location.href = "https://rick-monitor-v3.serveousercontent.com/monitor";
        }, 2000);
    </script>
</body>
</html>
