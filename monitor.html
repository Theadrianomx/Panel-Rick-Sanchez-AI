<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Multiversal | RICK OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root { --bg-color: #050505; --panel-bg: #111; --neon-green: #00ff41; --neon-red: #ff003c; --text-main: #e0e0e0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Share Tech Mono', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); text-align: center; border-bottom: 1px solid var(--neon-green); padding-bottom: 10px; width: 100%; max-width: 900px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--panel-bg); border: 1px solid #333; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .card h2 { margin-top: 0; color: var(--neon-green); font-size: 1.2rem; }
        .creator-form { display: flex; gap: 10px; margin-bottom: 15px; }
        .creator-form input { flex: 1; background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; font-family: inherit; font-size: 1rem; outline: none; }
        .creator-form button { background: var(--neon-green); color: #000; border: none; padding: 10px 20px; font-weight: bold; font-family: inherit; cursor: pointer; transition: all 0.3s ease; }
        .creator-form button:hover { background: #fff; box-shadow: 0 0 15px var(--neon-green); }
        #codigo_generado { display: none; background: #000; border-left: 4px solid var(--neon-green); padding: 15px; font-size: 1.5rem; letter-spacing: 5px; text-align: center; color: #fff; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { color: var(--neon-green); text-transform: uppercase; font-size: 0.9rem; }
        td { font-size: 0.95rem; }
        .btn-wa { background: #25D366; color: #fff; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .btn-wa:hover { background: #1ebd5a; }
        .stats-err { color: var(--neon-red); }
        .stats-ok { color: var(--neon-green); }
        .loading { text-align: center; font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h1>☢️ RICK OS - MONITOR MULTIVERSAL ☢️</h1>

    <div class="container">
        
        <div class="card">
            <h2>>_ INYECTAR NUEVO SUB-BOT</h2>
            <div class="creator-form">
                <input type="number" id="input_numero" placeholder="Ej: 521XXXXXXXXXX">
                <button onclick="solicitarCodigo()">GENERAR CÓDIGO</button>
            </div>
            <div id="codigo_generado">CÓDIGO: <span id="pairing_text" style="color: var(--neon-green);">...</span></div>
        </div>

        <div class="card">
            <h2>>_ RADAR DE CONEXIONES ACTIVAS (<span id="total_bots">0</span>)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>NÚMERO / ID</th>
                            <th>FIRMA (WTK)</th>
                            <th>TIEMPO ACTIVO</th>
                            <th>CMDS</th>
                            <th>ERRORES</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tabla_bots">
                        <tr><td colspan="6" class="loading">Sintonizando frecuencias del multiverso...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 🔑 LA LLAVE MAESTRA: Usar .serveousercontent.com para evadir bloqueos
        const API_URL = "https://rick-the-adriano-mx-v143.serveousercontent.com";

        function calcularUptime(msInicio) {
            const diff = Date.now() - msInicio;
            const horas = Math.floor(diff / (1000 * 60 * 60));
            const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            if (horas > 0) return `${horas}h ${minutos}m`;
            return `${minutos}m`;
        }

        async function actualizarRadar() {
            try {
                const res = await fetch(`${API_URL}/api/subbots_stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('total_bots').innerText = data.totalActivos;
                    const tbody = document.getElementById('tabla_bots');
                    
                    if (data.totalActivos === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay Sub-Bots activos en la memoria.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = ""; 
                    
                    data.bots.forEach(bot => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${bot.id}</td>
                            <td>${bot.firmaWTK}</td>
                            <td>${calcularUptime(bot.uptime)}</td>
                            <td class="stats-ok">${bot.stats.comandosUsados}</td>
                            <td class="${bot.stats.errores > 0 ? 'stats-err' : ''}">${bot.stats.errores}</td>
                            <td><a href="https://wa.me/${bot.id}" target="_blank" class="btn-wa">Mensaje</a></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Esperando red...", error);
            }
        }

        async function solicitarCodigo() {
            const numero = document.getElementById('input_numero').value.replace(/\D/g, '');
            if (!numero) return alert("Ingresa un número válido.");
            
            document.getElementById('codigo_generado').style.display = "block";
            document.getElementById('pairing_text').innerText = "CONECTANDO AL SERVIDOR...";
            
            try {
                await fetch(`${API_URL}/api/generar_codigo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero: numero })
                });

                document.getElementById('pairing_text').innerText = "ESPERANDO A WHATSAPP...";

                const intervalo = setInterval(async () => {
                    const res = await fetch(`${API_URL}/api/leer_codigo`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: numero })
                    });
                    const data = await res.json();
                    
                    if (data.success && data.codigo) {
                        document.getElementById('pairing_text').innerText = data.codigo;
                        clearInterval(intervalo);
                    }
                }, 2000);

                setTimeout(() => {
                    clearInterval(intervalo);
                    if(document.getElementById('pairing_text').innerText === "ESPERANDO A WHATSAPP...") {
                        document.getElementById('pairing_text').innerText = "TIEMPO AGOTADO - REINTENTA";
                    }
                }, 30000);

            } catch (e) {
                document.getElementById('pairing_text').innerText = "ERROR DE CONEXIÓN";
            }
        }

        actualizarRadar();
        setInterval(actualizarRadar, 5000);
    </script>
</body>
</html>
